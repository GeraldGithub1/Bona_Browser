<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warning: deceptive site ahead</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #b3261e; color: #fff;
    font-family: "Segoe UI", system-ui, "Ubuntu", sans-serif; }
  .box { max-width: 640px; padding: 40px; }
  .logo { width: 64px; height: 64px; background: #fff; border-radius: 16px; padding: 6px; }
  h1 { font-size: 30px; margin: 18px 0 8px; }
  p { font-size: 15px; line-height: 1.55; opacity: .95; }
  code { background: rgba(0, 0, 0, .25); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  ul { line-height: 1.6; }
  .actions { display: flex; gap: 12px; margin-top: 26px; align-items: center; flex-wrap: wrap; }
  button { background: #fff; color: #b3261e; border: 0; border-radius: 8px; padding: 11px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  a { color: #ffdcd8; font-size: 13px; }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo.svg" alt="BONA">
    <h1>Deceptive site ahead</h1>
    <p>BONA stopped this page because it shows signs of <strong>phishing</strong> — a fake site built to steal passwords, banking details or personal information.</p>
    <p>Address: <code id="url"></code></p>
    <p><strong>Why BONA is warning you:</strong></p>
    <ul id="reasons"></ul>
    <div class="actions">
      <button id="back">Take me back to safety</button>
      <a id="proceed" href="#">I understand the risk — visit anyway</a>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
