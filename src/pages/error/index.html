<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page could not load</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f9; color: #1b2a4a;
    font-family: "Segoe UI", system-ui, "Ubuntu", sans-serif; }
  .box { max-width: 600px; padding: 40px; }
  .logo { width: 60px; height: 60px; opacity: .9; }
  h1 { font-size: 26px; margin: 16px 0 6px; }
  p { color: #44536a; line-height: 1.55; }
  code { background: #e3e9ee; padding: 2px 6px; border-radius: 4px; word-break: break-all; font-size: 13px; }
  .actions { display: flex; gap: 14px; margin-top: 22px; align-items: center; flex-wrap: wrap; }
  button { background: #0e7c86; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
  a { color: #b3261e; font-size: 13px; }
  .cert { border-left: 4px solid #b3261e; padding: 4px 14px; background: #fbeceb; border-radius: 4px; }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo.svg" alt="BONA">
    <h1 id="title">This page could not load</h1>
    <p id="msg"></p>
    <p><code id="url"></code></p>
    <p class="muted"><small>Error: <span id="code"></span></small></p>
    <div class="actions">
      <button id="retry">Try again</button>
      <a id="http" href="#" hidden>Continue over an unencrypted (HTTP) connection</a>
    </div>
  </div>
  <script src="error.js"></script>
</body>
</html>
